<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1f262c">
    <title>Deadlock Dossier — Металлический архив досье героев</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Share+Tech+Mono&family=Special+Elite&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=Forum&family=Rubik+Mono+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="archive-room">
        <header class="archive-header">
            <div class="header-content">
                <div class="emblem-wrapper" title="Deadlock (Valve)">
                    <img src="assets/deadlock_icon.png" alt="Deadlock Logo" class="deadlock-official-emblem">
                </div>

                <div class="title-group">
                    <div class="archive-title-container">
                        <img src="assets/deadlock_logo.svg" alt="DEADLOCK" class="deadlock-title-logo">
                        <span class="archive-title-suffix">DOSSIER</span>
                    </div>
                </div>

                <div class="header-controls">
                    <div class="search-box" id="searchBox">
                        <input type="text" id="searchInput" placeholder="Поиск: герой, оружие, способность…" autocomplete="off">
                        <span class="search-count" id="searchCount"></span>
                        <button id="clearSearch" class="clear-search-btn" title="Очистить" hidden>✕</button>
                    </div>

                    <button id="soundToggle" class="sound-toggle-btn" title="Включить / выключить звуки архива">
                        <span class="sound-text">Звук: ВКЛ</span>
                    </button>
                </div>
            </div>
        </header>

        <main class="cabinet-stage">
            <!-- Стальной шкаф: слои — тень на полу, верхняя крышка, корпус с ячейками, цоколь -->
            <div class="cabinet" id="cabinet">
                <div class="cabinet-floor-shadow" aria-hidden="true"></div>
                <div class="cabinet-top" aria-hidden="true"></div>

                <div class="cabinet-body">
                    <div class="cabinet-rivet corner-tl" aria-hidden="true"></div>
                    <div class="cabinet-rivet corner-tr" aria-hidden="true"></div>
                    <div class="cabinet-rivet corner-bl" aria-hidden="true"></div>
                    <div class="cabinet-rivet corner-br" aria-hidden="true"></div>

                    <div class="cabinet-frame-top">
                        <div class="steel-plaque">
                            <span class="plaque-screw" aria-hidden="true"></span>
                            <span class="plaque-text">N.Y. DEPT. OF ANOMALY OVERSIGHT // DOSSIER REGISTRY</span>
                            <span class="plaque-screw" aria-hidden="true"></span>
                        </div>
                    </div>

                    <!-- Ячейки с дверцами и папками рендерятся из script.js -->
                    <div class="cabinet-cells" id="cabinetCells"></div>
                </div>

                <div class="cabinet-plinth" aria-hidden="true">
                    <span class="cabinet-foot left"></span>
                    <span class="cabinet-foot right"></span>
                </div>
            </div>
        </main>

        <!-- Открытое досье -->
        <div class="dossier-modal" id="dossierModal" aria-hidden="true">
            <div class="modal-backdrop" id="modalBackdrop"></div>

            <div class="dossier-document-envelope" role="dialog" aria-modal="true" aria-label="Досье героя">
                <button class="modal-close-btn" id="modalCloseBtn" title="Закрыть досье (ESC)">
                    ✕ ЗАКРЫТЬ ДОСЬЕ
                </button>

                <div class="dossier-paper" id="dossierPaper"></div>

                <div class="dossier-nav-bar">
                    <button class="dossier-nav-btn prev-btn" id="prevHeroBtn">← <span class="nav-label">ПРЕДЫДУЩЕЕ ДОСЬЕ</span></button>
                    <span class="dossier-counter-text" id="dossierCounter"></span>
                    <button class="dossier-nav-btn next-btn" id="nextHeroBtn"><span class="nav-label">СЛЕДУЮЩЕЕ ДОСЬЕ</span> →</button>
                </div>
            </div>
        </div>
    </div>

    <script src="heroes-data.js"></script>
    <script src="script.js"></script>
</body>
</html>
